name: Monitor Stock Pokemon TCG

on:
  schedule:
    # Corre cada 5 min y hace pasadas internas cada 25 segundos
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'Modo de ejecución manual'
        required: true
        default: 'COMPLETO'
        type: choice
        options:
          - COMPLETO
          - FORZAR_REPORTE
          - SOLO_ALERTAS

concurrency:
  group: pokemon-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python y caché de pip
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Restaurar estado (anti-spam y control de reportes)
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: pokemon-state-${{ github.run_number }}-${{ github.run_attempt }}
          restore-keys: |
            pokemon-state-

      - name: Ejecutar Rastreador
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          MODO_EJECUCION: ${{ github.event.inputs.modo || 'COMPLETO' }}
          REPORT_HOURS: "8,12,16,20"
          LOOP_SECONDS: "25"
          DEEP_SCAN_EVERY: "4"
          MAX_RUNTIME_SECONDS: "260"
        run: python bot.py

      - name: Guardar estado
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: pokemon-state-${{ github.run_number }}-${{ github.run_attempt }}
