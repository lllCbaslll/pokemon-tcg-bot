name: Monitor Stock Pokemon TCG

on:
  schedule:
    # Ejecuta cada 5 minutos (el script envía el consolidado 4 veces al día en hora Perú)
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'Modo de ejecución manual'
        required: true
        default: 'FORZAR_REPORTE'
        type: choice
        options:
          - COMPLETO
          - FORZAR_REPORTE
          - SOLO_ALERTAS

concurrency:
  group: pokemon-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python y caché de pip
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Restaurar estado (anti-spam y control de reportes)
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: pokemon-state-${{ github.run_number }}-${{ github.run_attempt }}
          restore-keys: |
            pokemon-state-

      - name: Ejecutar Rastreador
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MODO_EJECUCION: ${{ github.event.inputs.modo || 'COMPLETO' }}
          REPORT_HOURS: "8,12,16,20"
        run: python bot.py

      - name: Guardar estado
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: pokemon-state-${{ github.run_number }}-${{ github.run_attempt }}
