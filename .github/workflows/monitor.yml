name: Monitor Pokemon TCG 24/7

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python y Caché de PIP
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # <--- Activa la caché automática basada en requirements.txt

      - name: Instalar librerias
        run: |
          pip install -r requirements.txt

      - name: Ejecutar Rastreador (Bucle de alta frecuencia)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          END_TIME=$((SECONDS + 240))
          
          while [ $SECONDS -lt $END_TIME ]; do
            echo "--- Iniciando ciclo de rastreo: $(date) ---"
            python bot.py
            echo "--- Esperando 60 segundos para el siguiente escaneo... ---"
            sleep 60
          done
