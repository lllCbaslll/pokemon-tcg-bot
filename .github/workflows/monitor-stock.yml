name: Monitor Pokemon TCG - Stock Inmediato

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python y Cache de PIP
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar librerias
        run: |
          pip install -r requirements.txt

      - name: Ejecutar Rastreador
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MODO_EJECUCION: "SOLO_ALERTAS"
        run: |
          python bot.py
